<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Doctor — мастерская техники</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eef1f5;color:#222}
header{position:sticky;top:0;background:#fff;box-shadow:0 1px 6px #0002;z-index:20}.top{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700}
.money{color:#0a8f3c}nav{display:flex;overflow-x:auto}nav button{flex:1;padding:12px 8px;white-space:nowrap;border:0;background:#fff;font-size:15px;border-bottom:3px solid transparent}nav button.on{border-color:#0af;color:#0af;font-weight:700}
main{padding:12px;max-width:820px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{text-align:center;margin:0}.grid svg{width:60%;height:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.s{font-size:13px;color:#666}h3{margin:14px 0 8px}
button.b{background:#0af;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:14px}button.g{background:#0a8f3c}button.r{background:#d33}button.o{background:#e8a200}button.b:disabled{background:#bbb}
.tag{display:inline-block;background:#fde8e8;color:#c22;border-radius:6px;padding:2px 6px;font-size:12px;margin:2px 3px 2px 0}.tag.ok{background:#e3f7e8;color:#0a8f3c}.tag.f{background:#fff1d6;color:#a60}
input,select{padding:7px;border:1px solid #ccc;border-radius:8px;font-size:14px}input{width:100px}
.tools button{margin:0 4px 6px 0;border:2px solid #ccc;background:#fff;border-radius:10px;padding:6px 10px}.tools button.on{border-color:#0af;background:#e6f6ff}
.ws{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.phone{position:relative;width:260px;height:470px;border:5px solid #222;border-radius:38px;background:#d9dde3;overflow:hidden;flex:none}
.sl{overflow:hidden;position:absolute;border:2px solid #333;border-radius:10px;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center}
.sl.bad{background:#ffe3e3}.sl.sel{outline:3px solid #0af}.sl.empty{border-style:dashed;background:#f3f3f3;color:#999}
.cover{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.scr{background:#2a3b55;color:#fff}.gl{background:#f2f2f2;color:#444;border-radius:34px}.cr{background:repeating-linear-gradient(45deg,#2a3b55,#2a3b55 8px,#33466a 8px,#33466a 16px)}
.act{position:absolute;z-index:9;left:50%;bottom:4px;transform:translateX(-50%)}
.drv{position:absolute;z-index:10;left:50%;top:50%;margin:-26px;font-size:52px;animation:sp .3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#log{position:fixed;bottom:10px;left:10px;right:10px;max-width:800px;margin:auto;background:#222;color:#fff;border-radius:10px;padding:10px;display:none;z-index:50}
.lb{position:absolute;top:2px;left:4px;font-size:10px;background:#fffd;padding:0 4px;border-radius:4px;z-index:4;font-weight:700}.cover svg{width:100%;height:100%}.pg{height:10px;background:#ddd;border-radius:5px;overflow:hidden}.pg i{display:block;height:100%;background:#0af;animation:pg 3s linear forwards}@keyframes pg{from{width:0}to{width:100%}}.tag{white-space:nowrap}.acts{position:absolute;z-index:9;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:4px;white-space:nowrap}.bub{max-width:80%;padding:8px 10px;border-radius:12px;margin:4px 0;font-size:14px}.bub.c{background:#fff;border:1px solid #ddd}.bub.m{background:#cfeeff;margin-left:auto}.seg button{margin:0 4px 6px 0;border:2px solid #ccc;background:#fff;border-radius:10px;padding:6px 10px}.seg button.on{border-color:#0af;background:#e6f6ff}.big{width:100%;margin-top:10px;font-size:19px;padding:16px;border-radius:12px}</style></head><body>
<header><div class="top"><span>📱 Phone Doctor</span><span class="money" id="money"></span></div>
<nav><button id="t-shop" onclick="tab('shop')">Магазин</button><button id="t-work" onclick="tab('work')">Мастерская</button><button id="t-parts" onclick="tab('parts')">Запчасти</button><button id="t-lap" onclick="tab('lap')">💻 ПК телефона</button><button id="t-laptops" onclick="tab('laptops')">💻 Ноутбуки</button><button id="t-business" onclick="tab('business')">🏢 Бизнес</button><button id="t-chat" onclick="tab('chat')">Чат</button></nav></header>
<main id="app"></main><div id="log"></div>
<script>
// name, base price (Google б/у минус 4к), camera kind
const M=[["iPhone 11",12000,"d"],["iPhone 11 Pro",15000,"t"],["iPhone 12",16000,"d"],["iPhone 12 Pro",20000,"t"],["iPhone 13",19000,"d"],["iPhone 13 Pro",25000,"t"],["iPhone 14",24000,"d"],["iPhone 14 Pro",32000,"t"],["iPhone 15",32000,"d"],["iPhone 15 Pro",42000,"t"],["iPhone 16",45000,"d"],["iPhone 16 Pro",55000,"t"],["iPhone 17 Pro",70000,"t"],["iPhone 18 Pro",85000,"t"],["iPhone Duo",60000,"f"],["Galaxy A54",11000,"s"],["Galaxy S22",20000,"s"],["Galaxy S23",28000,"s"],["Galaxy S24",38000,"s"],["Honor 90",13000,"h"],["Honor X8",6000,"h"],["Redmi Note 12",7000,"x"],["Poco X5",9000,"x"]];
const PT={screen:{n:"Экран",pen:.4,pr:.3,tool:"suction"},glass:{n:"Заднее стекло",pen:.15,pr:.08,tool:"hair"},battery:{n:"АКБ",pen:.15,pr:.08,tool:"plates"},port:{n:"Разъём зарядки",pen:.1,pr:.05,tool:"tweezers"},board:{n:"Мат. плата",pen:.6,pr:.3,tool:"screw"}};
const TL={screw:"🪛 Отвёртка",suction:"🧲 Присоска",hair:"🔥 Фен",solder:"🔌 Паяльная станция",plates:"💳 Пластины",tweezers:"🔧 Пинцет"};
const SYM={screen:"Экран разбит",glass:"Трещины на задней крышке",battery:"Быстро разряжается",port:"Не заряжается",board:"Не включается"};
const LOOK={screen:"трещины, чёрные пятна",glass:"трещины",battery:"вздутие",port:"погнут",board:"следы гари"};
const CONN={screen:"📱 Дисплей",battery:"🔋 АКБ",port:"🔌 Зарядка"};
const R=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),f=n=>Math.round(n).toLocaleString("ru")+" ₽";
let G=JSON.parse(localStorage.getItem("prs2")||"null")||{money:20000,stock:[],inv:[],ads:[],shop:[],id:1,speed:1,t:Date.now(),tab:"shop",cur:null,flip:false,tool:"screw",sel:null,pm:"iPhone 11"};
let busy=null;G.pads=G.pads||[];G.chips=G.chips||0;G.used=G.used||[];G.junk=G.junk||[];G.chats=G.chats||[];G.cid=G.cid||1;G.rep=G.rep||0;G.ps=G.ps||"new";G.f=G.f||"all";if(!G.used.length)G.used=Array.from({length:8},genPart);
G.lshop=G.lshop||[];G.linv=G.linv||[];G.lstock=G.lstock||[];G.lcur=G.lcur||null;G.lmode=G.lmode||"market";G.lbrand=G.lbrand||"all";G.lpartBrand=G.lpartBrand||"Apple";G.lpartsTab=G.lpartsTab||"repair";
// Новые системы бизнеса: безопасная миграция старых сохранений prs2
G.biz=G.biz||{};G.biz.level=G.biz.level||1;G.biz.workshop=G.biz.workshop||1;G.biz.store=G.biz.store||1;
G.biz.staff=G.biz.staff||0;G.biz.clock=G.biz.clock||0;G.biz.lastEvent=G.biz.lastEvent||0;
G.biz.discountUntil=G.biz.discountUntil||0;G.biz.auction=G.biz.auction||[];
G.biz.stats=G.biz.stats||{sales:0,revenue:0,diagnostics:0,repairs:0};
G.biz.daily=G.biz.daily||{day:1,sales:0,diagnostics:0,revenue:0,bonus:false};
G.biz.event=G.biz.event||null;G.biz.notices=G.biz.notices||[];
G.biz.stats.sales=G.biz.stats.sales||0;G.biz.stats.revenue=G.biz.stats.revenue||0;G.biz.stats.diagnostics=G.biz.stats.diagnostics||0;G.biz.stats.repairs=G.biz.stats.repairs||0;
G.biz.daily.day=G.biz.daily.day||1;G.biz.daily.sales=G.biz.daily.sales||0;G.biz.daily.diagnostics=G.biz.daily.diagnostics||0;G.biz.daily.revenue=G.biz.daily.revenue||0;G.biz.daily.bonus=!!G.biz.daily.bonus;
const L=(p,t)=>{(p.log=p.log||[]).push(t);if(p.log.length>12)p.log.shift()};
function val(p){let v=.95;for(const t in PT){const x=p.parts[t];if(!x||x.st!="ok")v-=PT[t].pen;else{if(x.q=="fake")v-=.05;if(t=="battery")v-=(100-(x.hp??90))*.0008}}
 v-=(p.sc|0)*.01;if(p.locked&&!p.unlocked)v-=.1;if(p.icloud)v-=.35;if(p.setup)v+=.02;return Math.max(.08,v)*p.base}
function ph(m,k,bare){const L=(x,y,r=9)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#222" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r/2.6}" fill="none" stroke="#222" stroke-width="1.5"/>`,
 ap=m.startsWith("iPhone")?`<circle cx="60" cy="125" r="7" fill="none" stroke="#222" stroke-width="2"/>`:"";let c="";
 if(k=="t")c=`<rect x="22" y="16" width="52" height="52" rx="13" fill="none" stroke="#222" stroke-width="2"/>`+L(37,31)+L(37,53)+L(59,42);
 if(k=="d")c=`<rect x="22" y="16" width="46" height="46" rx="12" fill="none" stroke="#222" stroke-width="2"/>`+L(36,30)+L(54,48);
 if(k=="s")c=L(30,26,7)+L(30,48,7)+L(30,70,7);
 if(k=="h")c=`<circle cx="46" cy="44" r="27" fill="none" stroke="#222" stroke-width="2"/>`+L(36,36,7)+L(56,36,7)+L(46,56,7);
 if(k=="x")c=`<rect x="22" y="16" width="40" height="62" rx="8" fill="none" stroke="#222" stroke-width="2"/>`+L(38,34,8)+L(38,60,8);
 if(k=="f")c=`<line x1="15" y1="115" x2="105" y2="115" stroke="#222" stroke-width="2"/>`+L(34,28,7)+L(34,200,7);
 if(bare)return c+ap;
 return `<svg viewBox="0 0 120 230"><rect x="15" y="5" width="90" height="220" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><rect x="19" y="9" width="82" height="212" rx="15" fill="none" stroke="#222" stroke-width="1.2"/>${c}${ap}</svg>`}
function gen(fm){const m=fm?M.find(x=>x[0]==fm):M[R(0,M.length-1)],parts={};for(const t in PT)parts[t]={type:t,st:"ok",q:"orig"};parts.battery.hp=R(60,95);
 const ks=Object.keys(PT).sort(()=>Math.random()-.5).slice(0,R(1,2));ks.forEach(t=>parts[t].st=t=="board"?"burned":"broken");
 const p={id:G.id++,model:m[0],base:m[1],k:m[2],parts,table:[],sym:SYM[ks[0]],locked:Math.random()<.4,icloud:m[0].startsWith("iPhone")&&Math.random()<.3,sc:R(0,2),log:[],rep:0};p.price=Math.max(1000,Math.round(val(p)*(.8+Math.random()*.2)/100)*100);return p}
function save(){G.t=Date.now();localStorage.setItem("prs2",JSON.stringify(G))}
function msg(t){const l=document.getElementById("log");l.textContent=t;l.style.display="block";clearTimeout(msg.h);msg.h=setTimeout(()=>l.style.display="none",4000)}
const cur=()=>G.inv.find(p=>p.id==G.cur);
function spend(n,w){G.money-=n;msg("−"+f(n)+" · "+w)}
function tab(t){G.tab=t;G.sel=null;render()}
function refresh(){G.shop=mkShop();render()}
function buy(id){const p=G.shop.find(x=>x.id==id);if(G.money<p.price)return msg("Не хватает денег");spend(p.price,p.model);G.shop=G.shop.filter(x=>x!=p);G.inv.push(p);G.cur=G.cur||p.id;msg("Куплено за "+f(p.price)+"! Телефон в Мастерской");render()}
function buyPart(m,t,q){const b=M.find(x=>x[0]==m)[1],pr=Math.max(100,Math.round(b*PT[t].pr*(q=="fake"?.4:1)*(G.biz.discountUntil>G.biz.clock?.85:1)/10)*10);if(G.money<pr)return msg("Не хватает денег");
 spend(pr,PT[t].n+(q=="fake"?" (поделка)":" (оригинал)"));G.stock.push({id:G.id++,model:m,type:t,q,st:"ok",hp:t=="battery"?(q=="fake"?R(75,90):100):undefined});render()}
function doAct(t,fn){busy=t;render();setTimeout(()=>{busy=null;fn();render()},Math.max(500,1400-(G.biz.workshop-1)*250-G.biz.staff*150))}
function pick(t){if(busy)return;const p=cur();G.sel=p.parts[t]?{t,mode:"rm"}:{t,mode:"in",src:null};render()}
function rm(){const p=cur(),t=G.sel.t,P=PT[t];if(G.tool!=P.tool)return msg("Для этого нужно: "+TL[P.tool]);
 doAct(t,()=>{const x=p.parts[t];p.parts[t]=null;let m="Снято: "+P.n;
  if((t=="board"||t=="port")&&p.parts.battery&&Math.random()<.6){x.st="burned";m="⚡ Не отключил АКБ — замыкание! "+P.n+" сгорел(а)"}
  if((t=="screen"||t=="glass")&&Math.random()<.3){p.sc=(p.sc|0)+1;m+=" · мелкая царапина на корпусе";L(p,"Царапина при снятии: "+P.n)}
  L(p,"Снято: "+P.n);msg(m);p.table.push(x);G.sel=null})}
function trash(i){const p=cur(),x=p.table.splice(i,1)[0];G.junk.push({id:G.id++,model:p.model,type:x.type,q:x.q,st:x.st,hp:x.hp});if(G.junk.length>40)G.junk.shift();L(p,"Выброшено: "+PT[x.type].n);G.sel=null;msg("Выброшено в мусорку (Запчасти → Мусорка)");render()}
function fromJunk(id){const x=G.junk.find(j=>j.id==id);G.junk=G.junk.filter(j=>j!=x);G.stock.push(x);msg("Достал из мусорки — деталь на складе");render()}
function cands(p,t){return[...p.table.map((x,i)=>({k:"t:"+i,x})).filter(o=>o.x.type==t),...G.stock.filter(s=>s.model==p.model&&s.type==t).map(s=>({k:"s:"+s.id,x:s}))]}
function inst(k){const t=G.sel.t;if(["screen","battery","port"].includes(t)){if(!cur().parts.board)return msg("Некуда подключать — нет платы");G.sel.src=k;render()}else put(k,null)}
function put(k,c){const p=cur(),t=G.sel.t;doAct(t,()=>{let x;if(k[0]=="t")x=p.table.splice(+k.slice(2),1)[0];else{const s=G.stock.splice(G.stock.findIndex(s=>s.id==+k.slice(2)),1)[0];x={type:t,st:s.st,q:s.q,hp:s.hp}}
 let m="Установлено: "+PT[t].n;if(c&&c!=t){x.st="burned";if(p.parts.board&&Math.random()<.5)p.parts.board.st="burned";m="⚡ Подключил не туда! Деталь сгорела"+(p.parts.board.st=="burned"?" и плата тоже":"")}
 p.parts[t]=x;p.rep=(p.rep|0)+1;L(p,"Установлено: "+PT[t].n+(x.q=="fake"?" (поделка)":" (оригинал)")+(x.st=="burned"?" — сгорело":""));msg(m);G.sel=null})}
function power(){const p=cur(),a=[],P=p.parts;if(!P.board)return msg("Нет материнской платы");if(P.board.st!="ok")return msg("❌ Не включается (плата)");
 if(!P.battery||P.battery.st!="ok")a.push("нет питания от АКБ");if(!P.screen||P.screen.st!="ok")a.push("экран не работает");if(!P.port||P.port.st!="ok")a.push("не заряжается");if(!P.glass)a.push("нет задней крышки");else if(P.glass.st!="ok")a.push("трещины сзади");
 if(!a.length){G.biz.stats.repairs++;G.biz.daily.diagnostics++;}msg(a.length?"⚠ "+a.join(", "):(p.locked&&!p.unlocked?"✅ Включается, но заблокирован паролем — сбрось через Ноутбук":"✅ Телефон исправен! Оценка ~"+f(val(p))))}
function list(id){const p=G.inv.find(x=>x.id==id),v=+document.getElementById("pr"+id).value;if(!v)return msg("Укажи цену");G.inv=G.inv.filter(x=>x!=p);G.cur=G.inv[0]?G.inv[0].id:null;G.ads.push({...p,ask:v,left:R(5,60)*60000});msg("Выставлено. Бот придёт через 5–60 мин");render()}
function unlist(id){const a=G.ads.find(x=>x.id==id);G.ads=G.ads.filter(x=>x!=a);closeChats(a.id,"Объявление снято");G.inv.push(a);G.cur=G.cur||a.id;render()}
function chance(a){const r=a.ask/val(a),base=r<=1.1?1:r>=2?0:(2-r)/.9;return Math.min(1,base+(G.biz.store-1)*.06+Math.max(0,G.rep)*.002)}
function partVal(x){const b=M.find(m=>m[0]==x.model)[1];return Math.max(50,b*PT[x.type].pr*(x.q=="fake"?.4:1)*(x.st=="ok"?(x.type=="battery"?(x.hp??90)/100:1):.15))}
function tick(ms){let ch=bizTick(ms)?1:0;for(const t of G.chats){if(t.state=="return_wait"&&t.returnLeft>0){t.returnLeft-=ms*G.speed;if(t.returnLeft<=0){t.returnLeft=0;t.state="return";say(t,"Здравствуйте. Забрал телефон, но он оказался нерабочим. Хочу вернуть и получить деньги обратно.");msg("⚠️ Покупатель просит возврат: "+t.name);ch=1}}}
 for(const a of [...G.ads]){a.left-=ms*G.speed;if(a.left<=0){a.left=R(5,60)*60000;ch=1;if(G.chats.some(t=>t.adId==a.id&&t.state!="done"))continue;
  if(Math.random()<chance(a))mkThread(a,0);else if(Math.random()<.5)mkThread(a,1);else msg(`Покупатели смотрели ${a.model}, но цена высокая (рынок ~${f(val(a))})`)}}
 for(const a of [...G.pads]){a.left-=ms*G.speed;if(a.left<=0){const r=a.ask/partVal(a);if(Math.random()<(r<=1.1?1:r>=2?0:(2-r)/.9)){G.money+=a.ask;G.pads=G.pads.filter(x=>x!=a);msg(`Купили деталь: ${PT[a.type].n} ${a.model} за ${f(a.ask)}`)}else a.left=R(5,60)*60000;ch=1}}return ch}
function doCalib(x,p){if(!x||x.st!="ok")return msg("Прошивать можно только целую АКБ");if((x.hp??90)>=100)return msg("АКБ уже 100%");
 if(Math.random()<.5){x.hp=100;if(p)L(p,"АКБ прошита: 100%");msg("✅ АКБ прошита, ёмкость 100%")}else{x.st="burned";x.hp=0;if(p)L(p,"АКБ сгорела при прошивке");msg("🔥 АКБ сгорела при прошивке")}}
function calibR(r){const o=myParts().find(o=>o.r==r);doCalib(o.x,null);render()}
function toStock(i){const p=cur(),x=p.table.splice(i,1)[0];G.stock.push({id:G.id++,model:p.model,type:x.type,q:x.q,st:x.st,hp:x.hp});L(p,"На склад: "+PT[x.type].n);render()}
const idOf=r=>"pp"+r.replace(/\W/g,"_");
function myParts(){const o=G.stock.map(x=>({r:"s:"+x.id,x,m:x.model}));G.inv.forEach(p=>p.table.forEach((x,i)=>o.push({r:"t:"+p.id+":"+i,x,m:p.model})));return o}
function takeRef(r){if(r[0]=="s")return G.stock.splice(G.stock.findIndex(s=>s.id==+r.slice(2)),1)[0];const[,pid,ix]=r.split(":");return G.inv.find(p=>p.id==+pid).table.splice(+ix,1)[0]}
function listPart(r){const v=+document.getElementById(idOf(r)).value;if(!v)return msg("Укажи цену");const o=myParts().find(o=>o.r==r),m=o.m,x=takeRef(r);G.pads.push({id:G.id++,model:m,type:x.type,q:x.q,st:x.st,hp:x.hp,ask:v,left:R(5,60)*60000});msg("Деталь выставлена на продажу");render()}
function unlistPart(id){const a=G.pads.find(x=>x.id==id);G.pads=G.pads.filter(x=>x!=a);G.stock.push({id:a.id,model:a.model,type:a.type,q:a.q,st:a.st,hp:a.hp});render()}
function buyChip(){if(G.money<800)return msg("Не хватает денег");spend(800,"NAND-чип");G.chips=(G.chips|0)+1;render()}
function chipSwap(){const p=cur();if(G.tool!="solder")return msg("Для этого нужно: "+TL.solder);if(!G.chips)return msg("Нет NAND-чипа — купи во вкладке «Запчасти»");
 doAct("board",()=>{G.chips--;G.sel=null;if(p.parts.battery&&Math.random()<.6){p.parts.board.st="burned";L(p,"Плата сгорела при замене чипа");msg("⚡ Не отключил АКБ — плата сгорела");return}
  if(!p.icloud){L(p,"Заменён NAND-чип (iCloud не был включён)");msg("iCloud и так не был включён — чип потрачен зря");return}

function laptopTab(){let x=lcur(),h=`<div class="row"><h3>💻 Ноутбуки — магазин и мастерская</h3><span class="tag ok">Apple · ASUS · ARDOR</span></div><div class="seg"><button class="${G.lmode==="market"?"on":""}" onclick="G.lmode='market';render()">🛒 Магазин</button><button class="${G.lmode==="repair"?"on":""}" onclick="G.lmode='repair';render()">🧰 Мастерская (${G.linv.length})</button><button class="${G.lmode==="parts"?"on":""}" onclick="G.lmode='parts';render()">🔩 Запчасти (${G.lstock.length})</button></div>`;
 if(G.lmode==="market"){h+=`<div class="row"><select onchange="G.lbrand=this.value;render()"><option value="all">Все бренды</option>${["Apple","ASUS","ARDOR"].map(b=>`<option value="${b}" ${G.lbrand===b?"selected":""}>${b}</option>`).join("")}</select><button class="b" onclick="lrefresh()">Обновить объявления</button></div><div class="grid">`+(G.lshop.filter(a=>G.lbrand==="all"||a.brand===G.lbrand).map(a=>`<div class="card">${laptopArt(a)}<b>${a.model}</b><div class="s">${LBRAND[a.brand]} · б/у</div><span class="tag">Есть скрытые неисправности</span><br><b>${f(a.price)}</b><br><button class="b g" onclick="lbuy(${a.id})">Купить</button></div>`).join("")||"<p class='s'>Объявлений нет. Нажми «Обновить объявления».</p>")+`</div><h3>Мои ноутбуки</h3>`+(G.linv.map(a=>`<div class="card row"><span><b>${a.model}</b><br><span class="s">${LBRAND[a.brand]} · оценка ${f(lval(a))}</span></span><button class="b g" onclick="G.lcur=${a.id};G.lmode='repair';render()">Открыть в мастерской</button></div>`).join("")||"<p class='s'>Пока нет ноутбуков. Купи первый в магазине.</p>")}
 if(G.lmode==="repair"){if(!x)return h+`<div class="card">В мастерской пока нет ноутбуков. Перейди в магазин и купи неисправный ноутбук.</div>`;h+=`<div class="row"><select onchange="G.lcur=+this.value;render()">${G.linv.map(a=>`<option value="${a.id}" ${a.id===x.id?"selected":""}>${a.model}</option>`).join("")}</select><span class="s">Серийный № ${x.serial}</span><select onchange="G.tool=this.value;render()">${Object.keys(TL).map(t=>`<option value="${t}" ${G.tool===t?"selected":""}>${TL[t]}</option>`).join("")}</select></div><div class="ws" style="align-items:flex-start;margin-top:10px"><div class="card" style="flex:1;min-width:230px;text-align:center">${laptopArt(x)}<b>${x.model}</b><div class="s">${LBRAND[x.brand]} · ${x.kind==="game"?"игровой":"ноутбук"}</div><button class="b" onclick="ldiagnose()">🔍 Полная диагностика</button> <button class="b o" onclick="lclean()">✨ Чистка корпуса</button><button class="b o" onclick="lthermal()">🌡 Обслужить охлаждение</button><div style="margin-top:8px;text-align:left"><b>Неисправности и узлы</b>`+Object.keys(LPT).map(k=>{let a=x.parts[k],bad=!a||a.st!=="ok";return `<div class="card" style="padding:8px;margin:6px 0"><div class="row"><span><b>${LPT[k].n}</b><br><span class="s">${LPT[k].desc}</span></span><span class="tag ${bad?"":"ok"}">${!a?"нет детали":a.st==="burned"?"сгорела":bad?"неисправна":a.q==="orig"?"оригинал":a.q==="compat"?"совместимая":"б/у"}</span></div>`+(bad?`<select id="lr${k}" style="width:100%;margin-top:5px"><option value="">Выбери запчасть со склада</option>${G.lstock.filter(z=>z.brand===x.brand&&z.type===k).map(z=>`<option value="${z.id}">${z.q==="orig"?"Оригинал":z.q==="compat"?"Совместимая":"Б/у"} · ${LBRAND[z.brand]} · #${z.id}</option>`).join("")}</select><button class="b g" style="margin-top:5px" onclick="lrepair('${k}',+document.getElementById('lr${k}').value)">Установить</button>`:"")+`</div>`}).join("")+`</div></div><div class="card" style="flex:1;min-width:230px"><b>📈 Состояние и перепродажа</b><p>Оценочная стоимость: <b>${f(lval(x))}</b></p><p>Царапины корпуса: ${x.sc}</p><p>Чистка: ${x.clean?"выполнена":"не выполнена"}</p><p>Охлаждение: ${x.thermal?"обслужено":"не обслужено"}</p><b>Журнал ремонта</b>${(x.log||[]).slice().reverse().map(a=>`<div class="s">• ${a}</div>`).join("")||`<p class="s">Пока пусто</p>`}<hr><b>Выставить на продажу</b><p class="s">Чем выше цена относительно оценки, тем меньше шанс продажи.</p><input id="lask" type="number" value="${Math.round(lval(x))}" style="width:100%"><button class="b g" style="margin-top:6px" onclick="lsell()">Продать ноутбук</button></div></div>`}
 if(G.lmode==="parts"){h+=`<div class="row"><b>Склад запчастей</b><select onchange="G.lpartBrand=this.value;render()">${["Apple","ASUS","ARDOR"].map(b=>`<option ${G.lpartBrand===b?"selected":""}>${b}</option>`).join("")}</select></div>`+(G.lstock.map(a=>`<div class="card row"><span><b>${LPT[a.type].n}</b><br><span class="s">${LBRAND[a.brand]} · ${a.q==="orig"?"оригинал":a.q==="compat"?"совместимая":"б/у"}</span></span><span class="tag ok">На складе</span></div>`).join("")||`<p class="s">Склад пуст.</p>`)+`<h3>Купить запчасти</h3><p class="s">Оригинальные детали дороже. Совместимые дешевле, б/у — самые доступные. Детали разных брендов несовместимы.</p>`+Object.keys(LPT).map(k=>{let b=(LM.find(a=>a.brand===G.lpartBrand)||LM[0]).base,base=Math.max(250,Math.round(b*LPT[k].cost/50)*50);return `<div class="card"><b>${LPT[k].n}</b><div class="s">${LPT[k].desc}</div><div class="row" style="margin-top:6px"><button class="b" onclick="lbuyPart('${k}','orig')">Оригинал ${f(base)}</button><button class="b o" onclick="lbuyPart('${k}','compat')">Совместимая ${f(base*.72)}</button><button class="b" style="background:#667" onclick="lbuyPart('${k}','used')">Б/у ${f(base*.48)}</button></div></div>`}).join("")}
 return h}

// ---------- РАЗВИТИЕ БИЗНЕСА ----------
function bizRent(){return 250+(G.biz.workshop-1)*180+(G.biz.store-1)*350+G.biz.staff*450}
function bizDay(){return Math.floor(G.biz.clock/86400000)+1}
function bizTaskProgress(){return [{name:"Провести диагностику",v:G.biz.daily.diagnostics,goal:2},{name:"Продать технику",v:G.biz.daily.sales,goal:1},{name:"Получить выручку",v:G.biz.daily.revenue,goal:10000}]}
function bizUpdateDay(){let d=bizDay();if(d>G.biz.daily.day){let rent=bizRent(),staffIncome=G.biz.staff*900;G.money+=staffIncome;G.money-=rent;G.biz.daily={day:d,sales:0,diagnostics:0,revenue:0,bonus:false};if(G.money<0){G.rep=Math.max(-10,(G.rep|0)-1);G.money=0;G.biz.notices.unshift("Не хватило денег на аренду и зарплату. Репутация −1.")}else G.biz.notices.unshift("Заказы сотрудников: +"+f(staffIncome)+" · аренда и зарплаты: −"+f(rent));if(G.biz.notices.length>5)G.biz.notices.length=5;}}
function bizTick(ms){G.biz.clock+=ms*G.speed;bizUpdateDay();let appeared=false;if(!G.biz.event&&G.biz.clock-G.biz.lastEvent>28800000&&Math.random()<.025){appeared=true;G.biz.lastEvent=G.biz.clock;let e=R(0,3);G.biz.event=e===0?{type:"supplier",title:"📦 Поставщик предлагает скидку",desc:"Поставщик готов привезти набор ходовых деталей со скидкой. Предоплата 1 200 ₽, скидка 15% на закупки на 6 игровых часов."}:e===1?{type:"power",title:"⚡ Авария с электричеством",desc:"В здании отключили электричество. Можно вызвать аварийного электрика за 900 ₽ или потерять рабочее время и рейтинг."}:e===2?{type:"rival",title:"🏪 Конкурент открылся рядом",desc:"Соседний сервис запустил рекламу. Можно ответить рекламной кампанией за 2 000 ₽ или переждать."}:{type:"review",title:"⭐ Постоянный клиент оставил отзыв",desc:"Клиент доволен ремонтом и предлагает оставить чаевые за качественное обслуживание."};G.biz.event=e;}return appeared}
function bizEvent(choice){let e=G.biz.event;if(!e)return;if(e.type==="supplier"){if(choice&&G.money>=1200){G.money-=1200;G.biz.discountUntil=G.biz.clock+21600000;msg("Скидка поставщика активна 6 игровых часов")}else msg("От предложения поставщика отказались")}else if(e.type==="power"){if(choice&&G.money>=900){G.money-=900;G.rep++;msg("Электрик восстановил питание. Репутация +1")}else{G.rep--;msg("Простой мастерской. Репутация −1")}}else if(e.type==="rival"){if(choice&&G.money>=2000){G.money-=2000;G.rep+=2;msg("Рекламная кампания сработала! Репутация +2")}else{G.rep=Math.max(-10,G.rep-1);msg("Конкурент переманил часть клиентов. Репутация −1")}}else{G.money+=choice?1500:500;G.rep++;msg("Клиент оставил чаевые. Репутация +1")};G.biz.event=null;render()}
function bizUpgrade(kind){let cost=kind==="workshop"?(G.biz.workshop===1?15000:35000):kind==="store"?(G.biz.store===1?30000:60000):12000;if((kind==="workshop"&&G.biz.workshop>=3)||(kind==="store"&&G.biz.store>=3))return msg("Улучшение уже максимальное");if(kind==="staff"&&G.biz.staff>=3)return msg("Максимум 3 сотрудника");if(G.money<cost)return msg("Не хватает денег: нужно "+f(cost));G.money-=cost;if(kind==="workshop")G.biz.workshop++;if(kind==="store")G.biz.store++;if(kind==="staff")G.biz.staff++;G.biz.level=1+G.biz.workshop+G.biz.store+G.biz.staff;msg(kind==="staff"?"Нанят мастер. Зарплата 450 ₽/игровой день":"Бизнес улучшен!");render()}
function bizClaim(){let a=bizTaskProgress();if(G.biz.daily.bonus||!a.every(x=>x.v>=x.goal))return msg("Сначала выполни все ежедневные цели");G.biz.daily.bonus=true;G.money+=2500;G.rep++;msg("🎁 Ежедневный бонус: +2 500 ₽ и +1 репутация");render()}
function refreshAuction(){G.biz.auction=[];for(let i=0;i<3;i++){let laptop=Math.random()<.35;if(laptop){let x=lgen();x.price=Math.round(x.price*.72/100)*100;G.biz.auction.push({id:G.id++,kind:"laptop",item:x,price:x.price})}else{let x=gen();x.price=Math.round(x.price*.72/100)*100;G.biz.auction.push({id:G.id++,kind:"phone",item:x,price:x.price})}}render()}
function buyAuction(id){let a=G.biz.auction.find(x=>x.id===id);if(!a)return;if(G.money<a.price)return msg("Не хватает денег на лот");spend(a.price,"аукционный лот · "+a.item.model);if(a.kind==="phone"){a.item.price=a.price;G.inv.push(a.item);G.cur=a.item.id}else{a.item.price=a.price;a.item.buyPrice=a.price;G.linv.push(a.item);G.lcur=a.item.id}G.biz.auction=G.biz.auction.filter(x=>x!==a);msg("Аукционный лот куплен. Проверь скрытые неисправности!");render()}
function businessTab(){let tasks=bizTaskProgress(),rent=bizRent(),e=G.biz.event;let h=`<div class="row"><h3>🏢 Phone Doctor — управление бизнесом</h3><span class="tag ok">Уровень ${G.biz.level}</span></div><div class="grid"><div class="card"><div class="s">Капитал</div><b>${f(G.money)}</b></div><div class="card"><div class="s">Репутация</div><b>⭐ ${G.rep|0}</b></div><div class="card"><div class="s">Продано устройств</div><b>${G.biz.stats.sales}</b></div><div class="card"><div class="s">Общая выручка</div><b>${f(G.biz.stats.revenue)}</b></div></div><div class="card"><div class="row"><b>📊 Ежедневные цели · день ${G.biz.daily.day}</b><span class="s">Бонус 2 500 ₽</span></div>`+tasks.map(t=>`<div style="margin:9px 0"><div class="row"><span>${t.name}</span><b>${t.name==="Получить выручку"?f(Math.min(t.v,t.goal))+" / "+f(t.goal):t.v+" / "+t.goal}</b></div><div class="pg"><i style="width:${Math.min(100,t.v/t.goal*100)}%"></i></div></div>`).join("")+`<button class="b g" ${G.biz.daily.bonus||!tasks.every(x=>x.v>=x.goal)?"disabled":""} onclick="bizClaim()">Забрать ежедневный бонус</button></div>`;
 h+=`<div class="card"><b>🏗️ Развитие мастерской</b><p>Мастерская: уровень ${G.biz.workshop}/3 · Магазин: уровень ${G.biz.store}/3 · Сотрудники: ${G.biz.staff}/3</p><p class="s">Ежедневные расходы: ${f(rent)} (аренда, помещение и зарплаты)</p><div class="row"><button class="b" onclick="bizUpgrade('workshop')">Улучшить мастерскую · ${f(G.biz.workshop===1?15000:35000)}</button><button class="b" onclick="bizUpgrade('store')">Расширить магазин · ${f(G.biz.store===1?30000:60000)}</button><button class="b o" onclick="bizUpgrade('staff')">Нанять мастера · 12 000 ₽</button></div><p class="s">Уровень мастерской ускоряет ремонт, расширение магазина повышает шанс продажи. Каждый мастер приносит 900 ₽ за игровой день и получает 450 ₽ зарплаты. Мастеров можно нанять до трёх.</p></div>`;
 if(e)h+=`<div class="card"><b>${e.title}</b><p>${e.desc}</p><div class="row"><button class="b g" onclick="bizEvent(true)">${e.type==="supplier"?"Принять предложение":e.type==="power"?"Вызвать электрика за 900 ₽":e.type==="rival"?"Запустить рекламу за 2 000 ₽":"Принять чаевые 1 500 ₽"}</button><button class="b r" onclick="bizEvent(false)">${e.type==="review"?"Взять 500 ₽":"Отказаться"}</button></div></div>`;
 h+=`<div class="card"><div class="row"><b>🔨 Аукцион неисправной техники</b><button class="b" onclick="refreshAuction()">Обновить лоты</button></div><p class="s">Лоты дешевле обычных объявлений примерно на 28%, но скрытые дефекты могут оказаться серьёзными.</p>`+(G.biz.auction.map(a=>`<div class="row" style="border-top:1px solid #eee;padding:8px 0"><span><b>${a.item.model}</b><br><span class="s">${a.kind==="phone"?"📱 Смартфон":"💻 "+LBRAND[a.item.brand]}</span></span><span><b>${f(a.price)}</b><br><button class="b g" onclick="buyAuction(${a.id})">Купить лот</button></span></div>`).join("")||`<p class="s">Лотов пока нет. Нажми «Обновить лоты».</p>`) + `</div>`;
 h+=`<div class="card"><b>📈 Статистика и журнал</b><p>Диагностики: ${G.biz.stats.diagnostics} · успешные проверки: ${G.biz.stats.repairs}</p><p>Игровой день: ${bizDay()} · следующий расчёт расходов через ${Math.max(1,Math.ceil((86400000-(G.biz.clock%86400000))/3600000))} игровых часов</p>`+(G.biz.notices.map(n=>`<div class="s">• ${n}</div>`).join("")||`<p class="s">Пока событий не было.</p>`)+`</div>`;return h}

function render(){document.getElementById("money").textContent=f(G.money);document.getElementById("t-chat").textContent="Чат"+((n=>n?" ("+n+")":"")(G.chats.filter(t=>t.state!="done").length));["shop","work","parts","lap","laptops","business","chat"].forEach(t=>document.getElementById("t-"+t).className=G.tab==t?"on":"");let h="";
 if(G.tab=="shop"){h+=`<div class="row"><h3>Объявления</h3><span><select onchange="G.f=this.value;render()">${["all","iPhone","iPhone Duo","Galaxy","Honor","Redmi","Poco"].map(o=>`<option value="${o}" ${G.f==o?"selected":""}>${o=="all"?"Все":o}</option>`).join("")}</select> <button class="b" onclick="refresh()">Обновить</button></span></div><div class="grid">`+G.shop.filter(p=>G.f=="all"||p.model.startsWith(G.f)).map(p=>`<div class="card">${ph(p.model,p.k)}<b>${p.model}</b><br><span class="tag">${p.sym}</span><br><b>${f(p.price)}</b><br><button class="b g" onclick="buy(${p.id})">Купить</button></div>`).join("")+`</div><h3>Мои объявления</h3>`+(G.ads.map(a=>`<div class="card row"><div><b>${a.model}</b> · ${f(a.ask)}<br><span class="s">жду покупателя ~${Math.max(1,Math.ceil(a.left/60000/G.speed))} мин</span></div><button class="b r" onclick="unlist(${a.id})">Снять</button></div>`).join("")||'<p class="s">Ничего не выставлено</p>')}
 if(G.tab=="work")h+=work();if(G.tab=="lap")h+=lapTab();if(G.tab=="laptops")h+=laptopTab();if(G.tab=="business")h+=businessTab();if(G.tab=="parts")h+=partsExtra();if(G.tab=="chat")h+=chatTab();
 if(G.tab=="parts"){h+=psMenu();if(G.ps=="new")h+=`<h3>Запчасти</h3><select onchange="G.pm=this.value;render()">${M.map(m=>`<option ${m[0]==G.pm?"selected":""}>${m[0]}</option>`).join("")}</select><div style="margin-top:8px">`+Object.keys(PT).map(t=>{const b=M.find(x=>x[0]==G.pm)[1],o=Math.max(100,Math.round(b*PT[t].pr/10)*10),fk=Math.max(100,Math.round(b*PT[t].pr*.4/10)*10);return `<div class="card row"><span>${PT[t].n}</span><span><button class="b" onclick="buyPart('${G.pm}','${t}','orig')">Оригинал ${f(o)}</button> <button class="b o" onclick="buyPart('${G.pm}','${t}','fake')">Поделка ${f(fk)}</button></span></div>`}).join("")+`</div>`}
 h+=`<div class="row s" style="margin-top:16px"><label><input type="checkbox" style="width:auto" ${G.speed>1?"checked":""} onchange="G.speed=this.checked?60:1;save()"> Ускорить время ×60</label><button class="b r" onclick="if(confirm('Начать заново?')){localStorage.removeItem('prs2');location.reload()}">Сброс</button></div>`;
 document.getElementById("app").innerHTML=h;save()}
if(!G.shop.length)G.shop=mkShop();if(!G.lshop.length)G.lshop=Array.from({length:9},()=>lgen());if(!G.biz.auction.length)G.biz.auction=[];if(!G.shop.some(x=>x.model=="iPhone Duo"))G.shop.push(gen("iPhone Duo"));
tick(Math.min(Date.now()-G.t,864e5)/G.speed);render();
setInterval(()=>{if(tick(1000)&&!busy)render();else document.getElementById("money").textContent=f(G.money);save()},1000);
</script></body></html>
